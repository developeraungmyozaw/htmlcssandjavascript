<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>HLML form</h1>

    <form>
        <lable for="username">enter username : </lable>
        <input type="text" id="username" placeholder="username" required>      <br> <br> 
        <label for="email"> enter email : </label>
        <input type="email" id="email" placeholder="email" required>  <br> <br> 
        <label for="password"> password : </label>
        <input type="password" id="password" name="password" placeholder="password" required> <br> <br>

        <p> selector your age : </p>
        <input type="radio" name="age" value="0-25" id="option-1">
        <label for="option-1" > 0-25</label>
        <input type="radio" name="age" value="25-50" id="option-2">
        <label for="option-2" > 25-50</label>
        <input type="radio" name="age" value="51-71" id="option-3">
        <label for="option-3" > 51-71</label>
        <br>

        <label for="question" > security question : </label>
        <select name="question" id="question">
            <option value="q1"> what is your favorite pet </option>
            <option value="q2"> what is your country </option>
            <option value="q3"> what is your favorite color</option>
        </select>
        <br> <br>



        <label for="answer"> security answer : </label>
        <input type="text" id="answer" name="answer">
        <br> <br>

        <label for="bio"> Your bio : </label> <br>
        <textarea name="bio" id="bio" cols="30" rows="10" placeholder="about you ..." ></textarea>
        <br>

        <input type="submit" value="submit the form">


    </form>



</body>
</html>
